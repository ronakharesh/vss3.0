          args:
            - serve
            - --config_file
            - /vss-agent/deployments/developer-workflow/dev-profile-alerts/vss-agent/configs/config.yml
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            # Networking
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: EXTERNAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # LLM
            - name: LLM_MODE
              value: "local"
            - name: LLM_NAME
              value: "nvidia/nvidia-nemotron-nano-9b-v2"
            - name: LLM_BASE_URL
              value: "http://llm-nim:8000/v1"
            - name: LLM_MODEL_TYPE
              value: "nim"
            # VLM
            - name: VLM_MODE
              value: "local"
            - name: VLM_NAME
              value: "nvidia/cosmos-reason2-8b"
            - name: VLM_BASE_URL
              value: "http://vlm-nim:8000/v1"
            - name: VLM_MODEL_TYPE
              value: "nim"
            - name: RTVI_VLM_BASE_URL
              value: "http://vlm-nim:8000"
            # Agent config
            - name: VSS_AGENT_CONFIG_FILE
              value: "/vss-agent/deployments/developer-workflow/dev-profile-alerts/vss-agent/configs/config.yml"
            - name: VSS_AGENT_HOST
              value: "0.0.0.0"
            - name: VSS_AGENT_PORT
              value: "8000"
            - name: VSS_AGENT_OBJECT_STORE_TYPE
              value: "local_object_store"
            - name: VSS_AGENT_EXTERNAL_URL
              value: "http://vss-agent:8000"
            - name: STREAM_MODE
              value: "other"
            # Service URLs
            - name: VST_BASE_URL
              value: "http://vst-ingress:30888"
            - name: VST_INTERNAL_URL
              value: "http://vst-ingress:30888"
            - name: VST_EXTERNAL_URL
              value: "http://vst-ingress:30888"
            - name: VST_MCP_URL
              value: "http://vst-mcp:8001"
            - name: MDX_WEB_API_URL
              value: "http://video-analytics-api:8081"
            - name: VIDEO_ANALYSIS_MCP_URL
              value: "http://vss-agent-mcp:9901"
            - name: ELASTIC_SEARCH_ENDPOINT
              value: "http://elasticsearch:9200"
            - name: ELASTIC_SEARCH_INDEX
              value: "mdx-vlm-incidents"
            - name: PHOENIX_ENDPOINT
              value: "http://phoenix:6006"
            # API keys
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vss-secrets
                  key: NVIDIA_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vss-secrets
                  key: OPENAI_API_KEY
            - name: VSS_AGENT_REPORTS_BASE_URL
              value: "http://CHANGE_ME_HOST_IP:30801/static/"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 16  # 4 min grace
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
