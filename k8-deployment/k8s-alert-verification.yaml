              subPath: vst-storage.json
            - name: nvstreamer-data
              mountPath: /home/vst/vst_release/streamer_videos
              subPath: videos
            - name: nvstreamer-data
              mountPath: /home/vst/vst_release/vst_data
              subPath: vst_data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: nvstreamer-config
          configMap:
            name: nvstreamer-config
        - name: nvstreamer-data
          persistentVolumeClaim:
            claimName: nvstreamer-data

---
apiVersion: v1
kind: Service
metadata:
  name: nvstreamer
  namespace: vss-alerts
spec:
  selector:
    app: nvstreamer
  type: NodePort
  ports:
    - name: http
      port: 31000
      targetPort: 31000
      nodePort: 31000  # NVStreamer UI at http://<NODE_IP>:31000
    - name: rtsp
      port: 31554
      targetPort: 31554
      nodePort: 31554

---
# ---------------------------------------------------------------------------
# 9. PERCEPTION (DeepStream + GPU)
# ---------------------------------------------------------------------------
# NOTE: The perception-sdr (workload manager) mounts /var/run/docker.sock.
# In Kubernetes, pod lifecycle is managed by K8s itself, so the SDR's role
# of spawning/stopping DeepStream containers is not needed. The perception
# Deployment below replaces that dynamic management. If you need the SDR's
# stream-add/remove API at localhost:4001, deploy it with a hostPath volume
# for the Docker socket AND grant the node privileged access — not recommended
# for production. Consider using the K8s API via a custom controller instead.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: perception-alerts
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perception-alerts
  template:
    metadata:
      labels:
        app: perception-alerts
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      runtimeClassName: nvidia   # required for GPU access
      containers:
        - name: perception
          # Build: docker build -f deployments/developer-workflow/dev-profile-alerts/Dockerfiles/perception.Dockerfile \
          #          --build-arg PERCEPTION_IMAGE=nvcr.io/nvidia/vss-core/vss-rt-cv \
          #          --build-arg PERCEPTION_TAG=3.1.0 \
          #          deployments/developer-workflow/dev-profile-alerts
          image: CHANGE_ME_YOUR_REGISTRY/vss-perception-alerts:3.1.0
          command:
            - bash
            - -c
            - |
              sed -i 's/msg-broker-conn-str=localhost;9092/msg-broker-conn-str=kafka;9092/g' run_config-api-rtdetr-protobuf.txt
              exec bash ds-start.sh run_config-api-rtdetr-protobuf.txt
          env:
            - name: MODEL_TYPE
