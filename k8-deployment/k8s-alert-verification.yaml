# ── Alert Verification (VLM-based alert clip verifier) ─────────────────────
# Container entrypoint normally runs env-substitute.py to template config.yml
# and write the result to /app/runtime/config.yml, then exec enhance_alert_with_vlm.py.
# In K8s we skip env-substitute.py (values are pre-substituted in the ConfigMap)
# and mount the resolved config directly at the expected runtime path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-verification
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-verification
  template:
    metadata:
      labels:
        app: alert-verification
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      initContainers:
        - name: wait-for-deps
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Elasticsearch..."
              until curl -sf http://elasticsearch:9200/_cluster/health; do sleep 5; done
              echo "Waiting for Kafka..."
              until curl -sf http://kafka:9092 2>/dev/null || \
                    nc -z kafka 9092 2>/dev/null; do sleep 5; done
              echo "All deps ready"
      containers:
        - name: alert-verification
          image: nvcr.io/nvidia/vss-core/vss-alert-verification:3.1.0
          # Override the entrypoint — skip env-substitute.py since config is pre-resolved
          command: ["python", "enhance_alert_with_vlm.py", "--config", "/app/runtime/config.yml"]
          ports:
            - containerPort: 9080
          env:
            - name: VLM_MODE
              value: "local"
            - name: VLM_BASE_URL
              value: "http://vlm-nim:8000"
            - name: VLM_NAME
              value: "nvidia/cosmos-reason2-8b"
          volumeMounts:
            # Mount pre-resolved config at the path the app reads after env-substitution
            - name: config
              mountPath: /app/runtime/config.yml
              subPath: config.yml
            - name: config
              mountPath: /app/alert_type_config.json
              subPath: alert_type_config.json
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: alert-verification-config

---
apiVersion: v1
kind: Service
metadata:
  name: alert-verification
  namespace: vss-alerts
spec:
  selector:
    app: alert-verification
  ports:
    - port: 9080
      targetPort: 9080

