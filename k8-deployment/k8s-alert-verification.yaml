# ── VST Sensor ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vst-sensor
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vst-sensor
  template:
    metadata:
      labels:
        app: vst-sensor
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      securityContext:
        runAsUser: 0
      containers:
        - name: vst-sensor
          image: nvcr.io/nvidia/vss-core/vss-vios-sensor:3.1.0
          ports:
            - containerPort: 30000
          env:
            - name: ADAPTOR
              value: "vst_rtsp"
            - name: NEED_RECORDING
              value: "false"
            - name: NEED_RTSPSERVER
              value: "false"
            - name: NEED_STORAGE
              value: "false"
            - name: NEED_STREAM_MONITORING
              value: "true"
            - name: HTTP_PORT
              value: "30000"
            - name: CENTRALIZE_DB_NAME
              value: "nvcentralizedb"
            - name: CENTRALIZE_DB_USERNAME
              value: "vst"
            - name: STREAM_PROCESSOR_MODULE_ENDPOINT
              value: "http://vst-stream-processing:9010"
          volumeMounts:
            - name: vst-data
              mountPath: /home/vst/vst_release/vst_data
              subPath: vst_data
            - name: vst-data
              mountPath: /home/vst/vst_release/vst_video
              subPath: vst_video
          readinessProbe:
            tcpSocket:
              port: 30000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: vst-data
          persistentVolumeClaim:
            claimName: vst-data

---
apiVersion: v1
kind: Service
metadata:
  name: vst-sensor
  namespace: vss-alerts
spec:
  selector:
    app: vst-sensor
  ports:
    - port: 30000
      targetPort: 30000

