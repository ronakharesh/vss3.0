# =============================================================================
# NVIDIA VSS Alert Verification Workflow — Kubernetes Manifests
# Mode: verification (2d_cv), L40S hardware profile
#
# GPU layout (request adjusts per your cluster):
#   GPU 0  — RT_CV_DEVICE_ID   : DeepStream perception
#   GPU 1  — LLM_DEVICE_ID     : nvidia-nemotron-nano-9b-v2
#   GPU 2  — VLM_DEVICE_ID     : cosmos-reason2-8b
#
# Prerequisites:
#   • NVIDIA GPU Operator + device plugin installed
#   • kubectl + helm available, kubeconfig set
#   • nvcr.io login secret in namespace (see imagePullSecrets below)
#   • Dynamic PV provisioner (e.g., rancher/local-path-provisioner)
#   • ≥ 150 GB disk, ≥ 100 GB free GPU VRAM across 3+ GPUs
#
# Custom images — build and push BEFORE applying this manifest:
#   YOUR_REGISTRY/vss-elasticsearch:3.1.0
#     docker build -f deployments/foundational/Dockerfiles/elasticsearch.Dockerfile .
#   YOUR_REGISTRY/vss-elastic-init:3.1.0
#     docker build -f deployments/foundational/Dockerfiles/elastic-init.Dockerfile .
#   YOUR_REGISTRY/vss-broker-health-check:3.1.0
#     docker build -f deployments/foundational/Dockerfiles/kafka-health-check.Dockerfile .
#   YOUR_REGISTRY/vss-perception-alerts:3.1.0
#     docker build -f deployments/developer-workflow/dev-profile-alerts/Dockerfiles/perception.Dockerfile \
#       --build-arg PERCEPTION_IMAGE=nvcr.io/nvidia/vss-core/vss-rt-cv \
#       --build-arg PERCEPTION_TAG=3.1.0 \
#       deployments/developer-workflow/dev-profile-alerts
#   YOUR_REGISTRY/vss-kibana-init-alerts:3.1.0
#     docker build -f deployments/developer-workflow/dev-profile-alerts/Dockerfiles/kibana-dashboard.Dockerfile \
#       deployments/developer-workflow/dev-profile-alerts
#
# Network mapping (Docker host-mode → K8s ClusterIP service names):
#   localhost:9092  → kafka:9092
#   localhost:9200  → elasticsearch:9200
#   localhost:6379  → redis:6379
#   localhost:5601  → kibana:5601
#   localhost:6006  → phoenix:6006
#   localhost:30888 → vst-ingress:30888
#   localhost:31000 → nvstreamer:31000
#   localhost:30081 → llm-nim:8000
#   localhost:30082 → vlm-nim:8000
#   localhost:8000  → vss-agent:8000
#   localhost:8001  → vst-mcp:8001
#   localhost:9901  → vss-agent-mcp:9901
#   localhost:8081  → video-analytics-api:8081
#   localhost:3000  → vss-agent-ui:3000
#
# Usage:
#   # 1. Create namespace and secrets
#   kubectl create namespace vss-alerts
#   kubectl -n vss-alerts create secret docker-registry nvcr-secret \
#     --docker-server=nvcr.io \
#     --docker-username="\$oauthtoken" \
#     --docker-password=<YOUR_NGC_CLI_API_KEY>
#
#   # 2. Edit PLACEHOLDER values in this file (search for CHANGE_ME)
#
#   # 3. Apply
#   kubectl apply -f k8s-alert-verification.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# 1. NAMESPACE
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: vss-alerts

---
# ---------------------------------------------------------------------------
# 2. SECRETS
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: vss-secrets
  namespace: vss-alerts
type: Opaque
stringData:
  NGC_CLI_API_KEY: "CHANGE_ME_YOUR_NGC_CLI_API_KEY"
  NVIDIA_API_KEY: ""      # needed only for remote NIM endpoints
  OPENAI_API_KEY: ""      # needed only for OpenAI remote endpoints
  HF_TOKEN: ""            # optional Hugging Face token
  POSTGRES_PASSWORD: "vst"

---
