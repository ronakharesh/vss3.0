---
# =============================================================================
# EXTERNAL PORTS SUMMARY
# =============================================================================
# Service              NodePort   URL
# VSS Agent UI         30300      http://<NODE_IP>:30300
# VST Dashboard        30888      http://<NODE_IP>:30888/vst/#/dashboard
# NVStreamer UI        31000      http://<NODE_IP>:31000/#/dashboard
# Kibana               30561      http://<NODE_IP>:30561/app/home#/
# Phoenix              30606      http://<NODE_IP>:30606/projects
#
# =============================================================================
# DEPLOYMENT ORDER (wait for each step before proceeding)
# =============================================================================
# 1. kubectl apply -f k8s-alert-verification.yaml   (creates all objects)
# 2. Wait for infrastructure: kubectl -n vss-alerts rollout status deploy/kafka
#    kubectl -n vss-alerts rollout status deploy/elasticsearch
#    kubectl -n vss-alerts rollout status deploy/redis
# 3. Wait for init jobs:
#    kubectl -n vss-alerts wait --for=condition=complete job/kafka-topic-init --timeout=300s
#    kubectl -n vss-alerts wait --for=condition=complete job/elasticsearch-init --timeout=300s
# 4. Wait for NIM models (may take 20+ min on first start due to download):
#    kubectl -n vss-alerts wait --for=condition=ready pod -l app=llm-nim --timeout=1800s
#    kubectl -n vss-alerts wait --for=condition=ready pod -l app=vlm-nim --timeout=1800s
# 5. Wait for VST:
#    kubectl -n vss-alerts rollout status deploy/vst-sensor
#    kubectl -n vss-alerts rollout status deploy/vst-ingress
# 6. All other services start automatically.
# 7. Run kibana-init job after kibana is ready:
#    kubectl -n vss-alerts wait --for=condition=complete job/kibana-init --timeout=300s
#
# =============================================================================
# TEARDOWN
# =============================================================================
# kubectl delete namespace vss-alerts
# (PVCs are deleted with the namespace; PVs depend on your provisioner policy)
