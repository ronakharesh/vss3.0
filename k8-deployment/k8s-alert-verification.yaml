# ---------------------------------------------------------------------------
# 5. INIT JOBS
# ---------------------------------------------------------------------------

# Job: wait for Kafka, create required topics
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: vss-alerts
spec:
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: nvcr-secret
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:8.1.1
          command:
            - sh
            - -c
            - |
              until kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                echo "Waiting for Kafka..."; sleep 5
              done
              echo "Kafka is ready"
      containers:
        - name: topic-init
          image: confluentinc/cp-kafka:8.1.1
          command:
            - sh
            - -c
            - |
              TOPICS="mdx-raw mdx-bev mdx-space-utilization mdx-alerts mdx-behavior \
                mdx-behavior-plus mdx-frames mdx-mtmc mdx-rtls mdx-rtls-region-1 \
                mdx-amr mdx-vlm-alerts mdx-notification mdx-events mdx-incidents \
                mdx-vlm-incidents mdx-vlm mdx-embed mdx-embed-filtered"
              for TOPIC in $TOPICS; do
                kafka-topics --bootstrap-server kafka:9092 \
                  --create --if-not-exists \
                  --topic $TOPIC \
                  --partitions 8 \
                  --replication-factor 1 \
                  --config retention.ms=14400000
                echo "Topic $TOPIC created/verified"
              done

---
# Job: initialise Elasticsearch ILM policy, index templates, ingest pipelines
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: vss-alerts
spec:
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: nvcr-secret
      initContainers:
        - name: wait-for-es
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch:9200/_cluster/health; do
                echo "Waiting for Elasticsearch..."; sleep 5
              done
      containers:
        - name: elastic-init
          # Build: docker build -f deployments/foundational/Dockerfiles/elastic-init.Dockerfile .
          image: CHANGE_ME_YOUR_REGISTRY/vss-elastic-init:3.1.0
          env:
            - name: BP_PROFILE
              value: "bp_developer_alerts"
            - name: ELASTICSEARCH_CONNECTION_MAX_ATTEMPTS
              value: "20"
            - name: ELASTICSEARCH_ILM_MIN_AGE
              value: "4h"
            - name: ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM
              value: "1536"
            - name: ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM
              value: "768"

---
# Job: import Kibana dashboards
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-init
  namespace: vss-alerts
spec:
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: nvcr-secret
      initContainers:
        - name: wait-for-kibana
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://kibana:5601/api/status; do
                echo "Waiting for Kibana..."; sleep 5
              done
      containers:
        - name: kibana-dashboard
          # Build: docker build -f deployments/developer-workflow/dev-profile-alerts/Dockerfiles/kibana-dashboard.Dockerfile \
          #          deployments/developer-workflow/dev-profile-alerts
          image: CHANGE_ME_YOUR_REGISTRY/vss-kibana-init-alerts:3.1.0
          command:
            - bash
            - -c
            - |
              sed -i 's|localhost:9200|elasticsearch:9200|g; s|localhost:5601|kibana:5601|g' /opt/mdx/init-scripts/kibana-import-dashboard.sh
              exec bash /opt/mdx/init-scripts/kibana-import-dashboard.sh
          env:
            - name: KIBANA_URL
              value: "http://kibana:5601"

---
# ---------------------------------------------------------------------------
# 6. INFRASTRUCTURE DEPLOYMENTS + SERVICES
# ---------------------------------------------------------------------------

# ── Kafka ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nvcr-secret
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.1.1
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            # Must be reachable by all pods — use the K8s service DNS name
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx6G -Xms6G"
            - name: KAFKA_MAX_REQUEST_SIZE
              value: "10485760"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "10485760"
            - name: KAFKA_MAX_PARTITION_FETCH_BYTES
              value: "10485760"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "10485760"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-data"
            - name: CLUSTER_ID
              value: "KmvsFTucSYOV5BPqlgB__Q"
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kafka-data
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "10Gi"
              cpu: "4"
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: vss-alerts
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
# ── Elasticsearch ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chmod 777 /tmp/elastic/data /tmp/elastic/logs"]
          volumeMounts:
            - name: es-data
              mountPath: /tmp/elastic/data
              subPath: data
            - name: es-data
              mountPath: /tmp/elastic/logs
              subPath: logs
      containers:
        - name: elasticsearch
          # Build: docker build -f deployments/foundational/Dockerfiles/elasticsearch.Dockerfile .
          # If you cannot build the custom image, use docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          # and mount your elasticsearch.yml via ConfigMap
          image: CHANGE_ME_YOUR_REGISTRY/vss-elasticsearch:3.1.0
          ports:
            - containerPort: 9200
          env:
            - name: ES_JAVA_OPTS
              value: "-Xmx1024m -Xms256m"
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
          volumeMounts:
            - name: es-data
              mountPath: /tmp/elastic/data
              subPath: data
            - name: es-data
              mountPath: /tmp/elastic/logs
              subPath: logs
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "3Gi"
              cpu: "2"
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: elasticsearch-data

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: vss-alerts
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200

---
# ── Redis ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2.2-alpine
          command: ["redis-server", "/config/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-config
              mountPath: /config/redis.conf
              subPath: redis.conf
            - name: redis-data
              mountPath: /data
              subPath: data
            - name: redis-data
              mountPath: /log
              subPath: log
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vss-alerts
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ── Kibana ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.3.0
          ports:
            - containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: SERVER_PUBLICBASEURL
              value: "http://CHANGE_ME_HOST_IP:5601"
            - name: SERVER_SECURITYRESPONSEHEADERS_DISABLEEMBEDDING
              value: "false"
            - name: CSP_STRICT
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: vss-alerts
spec:
  selector:
    app: kibana
  type: NodePort
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30561  # access at http://<NODE_IP>:30561

---
# ── Logstash ───────────────────────────────────────────────────────────────
# NOTE: Logstash mounts protobuf binary descriptors and custom gems
#       from deployments/foundational/elk/. Create a ConfigMap or
#       pre-populate a PVC with those files. This manifest mounts them
#       from the same PVC as the app source (models-data as placeholder).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.3.0
          env:
            - name: LS_JAVA_OPTS
              value: "-Xmx1024m -Xms256m"
            - name: STREAM_TYPE
              value: "kafka"
          # Logstash config and protobuf files must be mounted here.
          # See deployments/foundational/elk/ for source files.
          # Mount them via ConfigMap (for .conf/.yml) and initContainer
          # (to copy binary .desc files from repo into the pod).
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: vss-alerts
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044

---
# ── Phoenix (Telemetry) ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-8.12.1
          ports:
            - containerPort: 6006
          env:
            - name: PHOENIX_WORKING_DIR
              value: "/.phoenix/"
            # K8s injects PHOENIX_PORT=tcp://... from the service; override with an integer
            - name: PHOENIX_PORT
              value: "6006"
          volumeMounts:
            - name: phoenix-data
              mountPath: /.phoenix
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: phoenix-data
          persistentVolumeClaim:
            claimName: phoenix-data

---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: vss-alerts
spec:
  selector:
    app: phoenix
  type: NodePort
  ports:
    - port: 6006
      targetPort: 6006
      nodePort: 30606  # access at http://<NODE_IP>:30606

---
# ── PostgreSQL (for VST) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "vst"
            - name: POSTGRES_DB
              value: "nvcentralizedb"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vst", "-d", "nvcentralizedb"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vst", "-d", "nvcentralizedb"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vss-alerts
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

