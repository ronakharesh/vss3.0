              readOnly: true
            - name: agent-eval
              mountPath: /vss-agent/agent_eval
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: app-configs
          hostPath:
            path: /home/shadeform/video-search-and-summarization/deployments
            type: Directory
        - name: agent-eval
          persistentVolumeClaim:
