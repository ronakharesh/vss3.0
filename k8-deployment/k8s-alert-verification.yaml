      containers:
        - name: vst-stream-processing
          image: nvcr.io/nvidia/vss-core/vss-vios-streamprocessing:3.1.0
          ports:
            - containerPort: 9010
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
