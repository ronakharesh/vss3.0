---
# ── SDR — Stream Data Router / Workload Manager ────────────────────────────
# Bridges VST stream events to DeepStream perception via Docker socket.
# Watches VST for new RTSP streams and sends stream configs to DeepStream.
# NOTE: In K8s the perception container is already running as a pod; the SDR
# handles stream add/remove but cannot spawn new Docker containers for perception
# (K8s manages perception pod lifecycle). Mount Docker socket for host-level access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perception-sdr
  namespace: vss-alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perception-sdr
  template:
    metadata:
      labels:
        app: perception-sdr
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      containers:
        - name: perception-sdr
          image: nvcr.io/nvidia/vss-core/sdr:3.1.0
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: WDM_INITIALIZE_FROM_VST
              value: "true"
            - name: WDM_WL_SPEC
              value: "/wdm-data/ds-data_wl.yaml"
            - name: WDM_CLUSTER_CONFIG_FILE
              value: "/wdm-configs/docker_cluster_config.json"
            - name: WDM_MSG_KEY
              value: "vst.event"
            - name: WDM_WL_REDIS_MSG_FIELD
              value: "sensor.id"
            - name: WDM_WL_ADD_URL
              value: "/api/v1/stream/add"
            - name: WDM_WL_DELETE_URL
              value: "/api/v1/stream/remove"
            - name: WDM_WL_HEALTH_CHECK_URL
              value: "/api/v1/stream/add"
            - name: VST_STREAMS_ENDPOINT
              value: "http://vst-ingress:30888/vst/api/v1/live/streams"
            - name: VST_STATUS_ENDPOINT
              value: "http://vst-ingress:30888/vst/api/v1/sensor/status"
            - name: WDM_WL_CHANGE_ID_ADD
              value: "camera_streaming"
            - name: WDM_CLEAR_DATA_WL
              value: "true"
            - name: WDM_CLUSTER_CONTAINER_NAMES
              value: '["perception-alerts"]'
          volumeMounts:
            - name: sdr-config
              mountPath: /wdm-configs/docker_cluster_config.json
              subPath: docker_cluster_config.json
            - name: sdr-data
              mountPath: /wdm-data
            - name: docker-socket
              mountPath: /var/run/docker.sock
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: sdr-config
          configMap:
            name: sdr-config
        - name: sdr-data
          emptyDir: {}
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket

---
apiVersion: v1
kind: Service
metadata:
  name: perception-sdr
  namespace: vss-alerts
spec:
  selector:
    app: perception-sdr
  ports:
    - port: 4001
      targetPort: 4001

