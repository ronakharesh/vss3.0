# ---------------------------------------------------------------------------
# 11. NIM MODELS (GPU-intensive; very long startup times)
# ---------------------------------------------------------------------------

# ── LLM NIM — nvidia-nemotron-nano-9b-v2 (GPU 1) ──────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-nim
  namespace: vss-alerts
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: llm-nim
  template:
    metadata:
      labels:
        app: llm-nim
    spec:
      imagePullSecrets:
        - name: nvcr-secret
      runtimeClassName: nvidia
      containers:
        - name: llm-nim
          image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:1
          ports:
            - containerPort: 8000
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vss-secrets
                  key: NGC_CLI_API_KEY
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "CHANGE_ME_LLM_DEVICE_ID"
            - name: NIM_MAX_MODEL_LEN
              value: "32768"
            - name: UCX_IB_DISABLE
              value: "1"
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
              readOnly: false
            - name: dshm
              mountPath: /dev/shm
          # NIM containers take 10-20 min on first start (model download/compile)
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            failureThreshold: 130   # 130 × 10s = ~22 min
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 2    # LLM: 2 GPUs for tensor parallelism (Mamba state cache too large for 1 GPU)
              memory: "60Gi"
            requests:
              memory: "40Gi"
              cpu: "4"
      volumes:
        - name: nim-cache
          hostPath:
            path: /var/lib/docker/volumes/mdx_nvidia_nemotron_nano_9b_v2_cache/_data
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

---
apiVersion: v1
kind: Service
metadata:
  name: llm-nim
  namespace: vss-alerts
spec:
  selector:
    app: llm-nim
  ports:
    - port: 8000
      targetPort: 8000

